<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Publicação canário</title><desc id="desc">Um roteador envia a maioria do tráfego à versão vigente e uma pequena coorte à candidata. Métricas controlam ampliação, pausa ou reversão.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:Inter,Segoe UI,sans-serif;fill:#16243A}.h{font:700 28px Charter,Georgia,serif}.t{font-size:18px}.s{font-size:15px;fill:#56677F}.b{fill:#fff;stroke:#254DB8;stroke-width:3}.f{fill:none;stroke:#254DB8;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1200" height="620" rx="16" fill="#F7FAFE"/><text x="42" y="62" class="h">Publicação canário <tspan font-style="italic" font-weight="400">(canary deployment)</tspan></text><path d="M42 92H1158" stroke="#CED9E9"/>
  <g transform="translate(54 220)"><circle cx="44" cy="24" r="18" fill="#5FC0D1"/><path d="M12 83c4-35 60-35 64 0" fill="#DDF4F3" stroke="#1597A5" stroke-width="3"/><text x="0" y="120" class="s">coorte elegível</text></g><path d="M180 275H315" class="f"/>
  <g transform="translate(315 190)"><path d="M0 0H180V170H0Z" class="b"/><path d="M20 26H160M20 52H160M20 78H160" stroke="#CED9E9" stroke-width="8"/><text x="48" y="137" class="t" font-weight="700">Roteador</text></g>
  <path d="M495 230C590 230 580 150 665 150" class="f"/><path d="M495 315C590 315 580 410 665 410" class="f"/><text x="540" y="194" class="t">90–99%</text><text x="540" y="376" class="t">1–10%</text>
  <g transform="translate(665 90)"><rect width="255" height="125" rx="12" class="b"/><text x="25" y="45" class="t" font-weight="700">Versão vigente</text><text x="25" y="80" class="s">referência operacional</text></g><g transform="translate(665 350)"><rect width="255" height="125" rx="12" fill="#EAF0FB" stroke="#254DB8" stroke-width="4"/><text x="25" y="45" class="t" font-weight="700">Versão candidata</text><text x="25" y="80" class="s">exposição limitada</text></g>
  <path d="M920 152H1010V266" class="f"/><path d="M920 412H1010V326" class="f"/><g transform="translate(965 266)"><rect width="190" height="82" rx="12" fill="#DDF4F3" stroke="#1597A5" stroke-width="3"/><text x="25" y="34" class="t" font-weight="700">Comparar</text><text x="25" y="62" class="s">por release_id</text></g><path d="M1060 348V495" class="f"/><rect x="850" y="500" width="305" height="68" rx="10" fill="#FFF4D8" stroke="#F2B84B" stroke-width="3"/><text x="875" y="530" class="t" font-weight="700">Ampliar · pausar · reverter</text><text x="875" y="553" class="s">critérios definidos antes</text>
</svg>

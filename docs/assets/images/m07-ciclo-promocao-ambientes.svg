<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo LLMOps entre ambientes</title>
  <desc id="desc">Ativos organizados formam um pacote versionado que é avaliado e promovido por desenvolvimento, homologação e produção. Observação retorna evidências ao planejamento.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:Inter,Segoe UI,sans-serif;fill:#16243A}.h{font:700 28px Charter,Georgia,serif}.t{font-size:18px}.s{font-size:15px;fill:#56677F}.box{fill:#fff;stroke:#254DB8;stroke-width:3}.env{fill:#EAF0FB;stroke:#254DB8;stroke-width:2}.flow{fill:none;stroke:#254DB8;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#5FC0D1;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="650" rx="16" fill="#F7FAFE"/><path d="M40 92H1160" stroke="#CED9E9"/><text x="40" y="62" class="h">Do ativo à evidência operacional</text>
  <g transform="translate(42 130)"><rect width="190" height="160" rx="12" class="box"/><text x="20" y="38" class="t" font-weight="700">1  Organizar</text><text x="20" y="73" class="s">modelo · prompt</text><text x="20" y="101" class="s">dados · políticas</text><text x="20" y="129" class="s">ferramentas · testes</text></g>
  <path d="M232 210H290" class="flow"/><g transform="translate(290 130)"><rect width="190" height="160" rx="12" class="box"/><text x="20" y="38" class="t" font-weight="700">2  Versionar</text><rect x="25" y="62" width="140" height="66" rx="6" fill="#EAF0FB" stroke="#5FC0D1"/><text x="42" y="90" class="s">manifesto</text><text x="42" y="115" class="s">release_id</text></g>
  <path d="M480 210H538" class="flow"/><g transform="translate(538 130)"><rect width="190" height="160" rx="12" class="box"/><text x="20" y="38" class="t" font-weight="700">3  Avaliar</text><text x="20" y="76" class="s">qualidade · risco</text><text x="20" y="104" class="s">custo · latência</text><text x="20" y="132" class="s">portões e aprovação</text></g>
  <path d="M728 210H786" class="flow"/><g transform="translate(786 130)"><rect width="372" height="160" rx="12" class="box"/><text x="20" y="38" class="t" font-weight="700">4  Promover o mesmo pacote</text><rect x="20" y="62" width="98" height="62" rx="6" class="env"/><rect x="137" y="62" width="98" height="62" rx="6" class="env"/><rect x="254" y="62" width="98" height="62" rx="6" fill="#DDF4F3" stroke="#1597A5" stroke-width="2"/><text x="31" y="88" class="s">Desenvol-</text><text x="42" y="110" class="s">vimento</text><text x="145" y="99" class="s">Homologação</text><text x="269" y="99" class="s">Produção</text><path d="M118 93H134M235 93H251" class="flow"/></g>
  <path d="M972 290V363" class="flow"/><g transform="translate(786 365)"><rect width="372" height="130" rx="12" fill="#DDF4F3" stroke="#1597A5" stroke-width="3"/><text x="20" y="39" class="t" font-weight="700">5  Publicar e observar</text><text x="20" y="76" class="s">exposição controlada · métricas</text><text x="20" y="103" class="s">avançar · pausar · reverter</text></g>
  <path d="M786 430H394C250 430 164 386 140 306" class="dash"/><rect x="382" y="403" width="256" height="54" rx="27" fill="#fff" stroke="#5FC0D1" stroke-width="2"/><text x="411" y="437" class="t">evidência → novo pacote</text>
  <text x="42" y="585" class="s">Promoção acrescenta evidência; não altera silenciosamente o pacote.</text><path d="M42 606H1158" stroke="#F2B84B" stroke-width="5"/>
</svg>

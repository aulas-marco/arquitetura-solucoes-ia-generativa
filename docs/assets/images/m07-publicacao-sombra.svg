<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Publicação sombra</title><desc id="desc">A entrada real segue para a versão vigente e uma cópia controlada vai à candidata. A saída candidata é isolada, comparada e nunca chega ao usuário.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#254DB8"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1597A5"/></marker><style>text{font-family:Inter,Segoe UI,sans-serif;fill:#16243A}.h{font:700 28px Charter,Georgia,serif}.t{font-size:18px}.s{font-size:15px;fill:#56677F}.b{fill:#fff;stroke:#254DB8;stroke-width:3}.f{fill:none;stroke:#254DB8;stroke-width:4;marker-end:url(#a)}.d{fill:none;stroke:#1597A5;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#c)}</style></defs><rect width="1200" height="620" rx="16" fill="#F7FAFE"/><text x="42" y="62" class="h">Publicação sombra <tspan font-style="italic" font-weight="400">(shadow deployment)</tspan></text><path d="M42 92H1158" stroke="#CED9E9"/>
  <g transform="translate(45 250)"><circle cx="46" cy="20" r="18" fill="#5FC0D1"/><path d="M12 82c4-38 64-38 68 0" fill="#DDF4F3" stroke="#1597A5" stroke-width="3"/><text x="6" y="118" class="s">usuário</text></g><path d="M155 285H315" class="f"/>
  <g transform="translate(315 220)"><rect width="190" height="130" rx="12" class="b"/><text x="28" y="48" class="t" font-weight="700">Duplicação</text><text x="28" y="79" class="s">controlada</text><text x="28" y="104" class="s">e autorizada</text></g>
  <path d="M505 250C590 250 585 155 675 155" class="f"/><path d="M505 325C590 325 585 420 675 420" class="d"/>
  <g transform="translate(675 95)"><rect width="240" height="120" rx="12" class="b"/><text x="26" y="45" class="t" font-weight="700">Versão vigente</text><text x="26" y="79" class="s">resposta autoritativa</text></g><g transform="translate(675 360)"><rect width="240" height="120" rx="12" fill="#DDF4F3" stroke="#1597A5" stroke-width="3" stroke-dasharray="9 6"/><text x="26" y="45" class="t" font-weight="700">Versão candidata</text><text x="26" y="78" class="s">efeitos isolados</text></g>
  <path d="M795 95C795 32 210 32 110 218" class="f"/><text x="365" y="30" class="s">somente a resposta vigente retorna</text><path d="M915 420H1010" class="d"/><g transform="translate(1010 365)"><rect width="150" height="112" rx="12" fill="#fff" stroke="#1597A5" stroke-width="3"/><text x="21" y="39" class="t" font-weight="700">Comparar</text><text x="21" y="70" class="s">custo · erro</text><text x="21" y="94" class="s">latência · saída</text></g><path d="M1085 477V535" class="d"/><text x="912" y="568" class="t" fill="#1597A5">não retorna · não executa</text><path d="M905 583H1160" stroke="#D34232" stroke-width="4"/>
</svg>

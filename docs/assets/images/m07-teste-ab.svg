<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Teste A/B</title><desc id="desc">Participantes comparáveis são atribuídos de forma estável às variantes A e B, ambas aprovadas. Métricas estimam o efeito sobre uma hipótese prévia.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:Inter,Segoe UI,sans-serif;fill:#16243A}.h{font:700 28px Charter,Georgia,serif}.t{font-size:18px}.s{font-size:15px;fill:#56677F}.b{fill:#fff;stroke:#254DB8;stroke-width:3}.f{fill:none;stroke:#254DB8;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1200" height="620" rx="16" fill="#F7FAFE"/><text x="42" y="62" class="h">Teste A/B <tspan font-style="italic" font-weight="400">(A/B testing)</tspan></text><path d="M42 92H1158" stroke="#CED9E9"/>
  <g transform="translate(48 230)"><circle cx="34" cy="20" r="16" fill="#5FC0D1"/><circle cx="82" cy="20" r="16" fill="#254DB8"/><circle cx="130" cy="20" r="16" fill="#F2B84B"/><path d="M8 76c3-30 49-30 52 0M56 76c3-30 49-30 52 0M104 76c3-30 49-30 52 0" fill="none" stroke="#16243A" stroke-width="3"/><text x="5" y="115" class="s">participantes elegíveis</text></g><path d="M240 278H350" class="f"/>
  <g transform="translate(350 205)"><rect width="210" height="145" rx="12" class="b"/><text x="24" y="42" class="t" font-weight="700">Atribuição estável</text><text x="24" y="76" class="s">usuário · conta</text><text x="24" y="103" class="s">sessão · organização</text></g><path d="M560 240C630 240 625 160 700 160" class="f"/><path d="M560 315C630 315 625 405 700 405" class="f"/>
  <g transform="translate(700 105)"><rect width="215" height="112" rx="12" fill="#EAF0FB" stroke="#254DB8" stroke-width="3"/><circle cx="42" cy="54" r="25" fill="#254DB8"/><text x="34" y="62" font-size="24" fill="#fff">A</text><text x="82" y="48" class="t" font-weight="700">Variante A</text><text x="82" y="77" class="s">aprovada</text></g><g transform="translate(700 350)"><rect width="215" height="112" rx="12" fill="#DDF4F3" stroke="#1597A5" stroke-width="3"/><circle cx="42" cy="54" r="25" fill="#1597A5"/><text x="34" y="62" font-size="24" fill="#fff">B</text><text x="82" y="48" class="t" font-weight="700">Variante B</text><text x="82" y="77" class="s">aprovada</text></g>
  <path d="M915 160H1020V270" class="f"/><path d="M915 405H1020V333" class="f"/><g transform="translate(960 270)"><rect width="195" height="90" rx="12" fill="#FFF4D8" stroke="#F2B84B" stroke-width="3"/><text x="20" y="34" class="t" font-weight="700">Estimar efeito</text><text x="20" y="62" class="s">hipótese + proteção</text></g><rect x="320" y="510" width="560" height="62" rx="10" fill="#fff" stroke="#CED9E9" stroke-width="2"/><text x="352" y="548" class="t">A pergunta é de produto; segurança já foi demonstrada.</text>
